enableScripts: false

nodeLinker: node-modules

# Los paquetes @fortawesome/pro-* viven en el registro privado de FontAwesome,
# no en npm. Esto es solo la DIRECCIÓN, que no es secreta.
#
# El token NO va acá y no debe ir nunca: este repositorio es público y este
# archivo está versionado. Vive en `~/.yarnrc.yml` (fuera de todo repo) en las
# máquinas de desarrollo, y en el CI se escribe a nivel de home desde el
# secreto FONTAWESOME_NPM_TOKEN antes de instalar.
npmScopes:
  fortawesome:
    npmRegistryServer: 'https://npm.fontawesome.com/'
