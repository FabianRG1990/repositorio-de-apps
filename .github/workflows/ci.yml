name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    # Sin esto, un paso colgado corre hasta el límite de 6 horas de GitHub y
    # recién ahí se cancela: el run 32224073696 ocupó un runner seis horas y
    # bloqueó un merge toda una jornada. Un CI que normalmente tarda dos
    # minutos no tiene nada que hacer a los veinte (ver issue #65).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Este workspace usa Yarn 4 (packageManager en package.json, yarn.lock
      # con __metadata v9). Corepack tiene que activarse ANTES de setup-node
      # para que su cache de 'yarn' pueda resolver la carpeta de caché de berry.
      - run: corepack enable

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'

      # Los paquetes @fortawesome/pro-* vienen de un registro privado. El token
      # se escribe a nivel de HOME, nunca en el .yarnrc.yml del repo: este
      # repositorio es público y ese archivo está versionado. La dirección del
      # registro sí vive allí, porque no es secreta.
      - run: yarn config set npmRegistries --home --json "{\"//npm.fontawesome.com/\":{\"npmAuthToken\":\"$FONTAWESOME_NPM_TOKEN\"}}"
        env:
          FONTAWESOME_NPM_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

      - run: yarn install --immutable

      # Los navegadores de Playwright no vienen con la instalación de paquetes.
      # apps/bahia-e2e corre sobre chromium y firefox, así que hay que bajarlos
      # antes del e2e (ver issue #40).
      #
      # SIN `--with-deps` a propósito. Esa bandera instala librerías de sistema
      # vía apt, y ahí es donde el CI se colgaba: el mirror
      # azure.archive.ubuntu.com no responde desde el runner y apt reintenta en
      # bucle. En el run 32295034910 se ve `Ign: ... noble InRelease` repetido
      # durante diez minutos, mientras los repos de Microsoft y Google
      # contestaban en milisegundos. La imagen de ubuntu-latest ya trae las
      # librerías que Playwright necesita, así que apt sobra (ver issue #65).
      #
      # La descarga de binarios va contra el CDN de Playwright, no contra apt,
      # y siempre funcionó. Se cachea para no repetirla en cada corrida.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install
        timeout-minutes: 10

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: yarn nx record -- yarn nx format:check --base="remotes/origin/main"
      - run: yarn nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: npx nx fix-ci
        if: always()
