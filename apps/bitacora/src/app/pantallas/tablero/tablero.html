<div class="pantalla">
  @let enTaller = store.enElTaller();

  <div class="pantalla__cabecera">
    <!-- Lo entregado ya no está en el taller, y esta pantalla se llama "En el
         taller": mostrarlo acá contradecía su propio título. -->
    <p class="pantalla__conteo">
      {{ enTaller.length }} {{ enTaller.length === 1 ? 'vehículo' : 'vehículos'
      }} · ordenados por tiempo parado
    </p>

    <!-- Lleva a Recepción, que es donde se recibe un Vehículo. Antes no hacía
         nada: un botón primario que no responde enseña que la app está rota
         aunque el resto funcione.

         `alto="grande"` porque es la acción principal de la pantalla: #18 §5.2
         pide el escalón de arriba para la acción principal con guante. -->
    <a app-boton tono="solido" alto="grande" class="pantalla__accion" routerLink="/recepcion">
      <fa-icon [icon]="['fas', 'car-side']" />
      Recibir vehículo
    </a>
  </div>

  <ul class="lista">
    @for (orden of enTaller; track orden.folio) {
    <li
      app-fila-orden
      [orden]="orden"
      [seleccionada]="store.folioSeleccionado() === orden.folio"
      (elegida)="store.seleccionar(orden.folio)"
      (detallePedido)="verOrden(orden.folio)"
    ></li>
    }
  </ul>
</div>
