<div class="pantalla">
  <div class="pantalla__cabecera">
    <p class="pantalla__conteo">
      {{ store.ordenes().length }} vehículos · ordenados por tiempo parado
    </p>

    <!-- Lleva a Recepción, que es donde se recibe un Vehículo. Antes no hacía
         nada: un botón primario que no responde enseña que la app está rota
         aunque el resto funcione. -->
    <a matButton="filled" class="pantalla__accion" routerLink="/recepcion">
      <fa-icon [icon]="['fas', 'car-side']" />
      Recibir vehículo
    </a>
  </div>

  <ul class="lista">
    @for (orden of store.ordenes(); track orden.folio) {
    <li
      app-fila-orden
      [orden]="orden"
      [seleccionada]="store.folioSeleccionado() === orden.folio"
      (elegida)="store.seleccionar(orden.folio)"
      (detallePedido)="verOrden(orden.folio)"
    ></li>
    }
  </ul>
</div>
