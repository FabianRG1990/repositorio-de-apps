<div class="raiz">
  <app-lista-pestanas
    [pestanas]="pestanas"
    [activa]="activa()"
    etiqueta="Vistas de ajustes"
    (elegida)="activa.set($event)"
  />

  <div class="paneles">
    @switch (activa()) { @case ('taller') {
    <section
      role="tabpanel"
      id="panel-taller"
      aria-labelledby="pestana-taller"
      class="panel"
    >
      <app-ajustes-taller />
    </section>
    } @case ('especialidades') {
    <section
      role="tabpanel"
      id="panel-especialidades"
      aria-labelledby="pestana-especialidades"
      class="panel"
    >
      <app-ajustes-especialidades />
    </section>
    } @case ('apariencia') {
    <section
      role="tabpanel"
      id="panel-apariencia"
      aria-labelledby="pestana-apariencia"
      class="panel"
    >
      <app-apariencia />
    </section>
    } }
  </div>
</div>
