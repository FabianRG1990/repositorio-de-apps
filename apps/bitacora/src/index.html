<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>bitacora</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      La fuente entra en la lista de descarga con el HTML y no cuando el CSS
      la descubre: sin esto, `font-display: swap` deja la lista en Arial la
      primera vez y salta al pintarla. `crossorigin` es obligatorio aunque el
      origen sea el mismo — sin el atributo la petición del preload y la del
      `@font-face` son distintas y el archivo se baja dos veces.
    -->
    <link
      rel="preload"
      href="/fuentes/InterVariable-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
